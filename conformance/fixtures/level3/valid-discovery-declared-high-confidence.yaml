# Level 3 — valid but WARNS: declared unit with confidence outside [0.5, 0.8) (RFC-0018 §5.1)
#
# Normative rule: a unit with verification_status: declared SHOULD declare
# confidence in [0.5, 0.8). This fixture violates the SHOULD (confidence: 0.95),
# so validators MUST emit an advisory warning — but the manifest remains valid
# (SHOULD, not MUST; compare rumored, where confidence >= 0.5 violates a MUST).
kcp_version: "0.16"
project: test-discovery-declared-high-confidence
version: "1.0.0"

units:
  - id: overconfident-self-description
    path: capabilities/overconfident-self-description.md
    intent: "First-party self-description claiming verified-level confidence"
    scope: project
    audience: [agent]
    discovery:
      verification_status: declared
      source: manual
      observed_at: "2026-06-11T10:00:00Z"
      confidence: 0.95        # WARNS: declared SHOULD have confidence in [0.5, 0.8)
