# KCP eats its own dogfood.
# This manifest describes the Knowledge Context Protocol repository itself.
version: "0.21"

entity:
  name: Knowledge Context Protocol (KCP)
  domain: cantara.github.io/knowledge-context-protocol
  type: open-standard
  description: >
    A structured metadata standard that makes knowledge navigable by AI agents.
    KCP is to knowledge what MCP is to tools. Defines how to publish
    knowledge.yaml manifests with intents, dependency chains, audience
    targeting, freshness dating, signing, and federation — so agents navigate
    efficiently without trial and error.

authority:
  owner: Cantara — Norwegian Software Development Foundation
  repo: https://github.com/Cantara/knowledge-context-protocol
  license: Apache-2.0
  website: https://cantara.github.io/knowledge-context-protocol/
  org_manifest: https://wiki.cantara.no/knowledge/projects/kcp.yaml

discovery:
  provenance: canonical
  confidence: high
  staleness_days: 14

signing:
  scheme: ed25519
  scope: this-manifest
  public_key: https://cantara.github.io/knowledge-context-protocol/.well-known/kcp-signing-key.pub
  signature: https://cantara.github.io/knowledge-context-protocol/knowledge.yaml.sig

# Legacy header fields (preserved for consumers that read them directly)
kcp_version: "0.30"
project: knowledge-context-protocol
spec_version: 0.21.0
updated: "2026-06-13"
language: en
license: "Apache-2.0"
indexing: open

rate_limits:
  default:
    requests_per_minute: 60
    requests_per_day: 5000

