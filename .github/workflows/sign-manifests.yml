name: Sign KCP manifests

on:
  push:
    branches: [main]
    paths:
      - 'knowledge.yaml'
      - 'docs/knowledge.yaml'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-sign]')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Restore signing key
        env:
          KCP_SIGNING_KEY: ${{ secrets.KCP_SIGNING_KEY }}
        run: |
          printf '%s' "$KCP_SIGNING_KEY" > /tmp/kcp-signing.pem
          chmod 600 /tmp/kcp-signing.pem

      - name: Sign manifests
        run: |
          set -euo pipefail
          sign_manifest() {
            local f="$1"
            local sigpath="$2"
            openssl pkeyutl -sign -rawin -inkey /tmp/kcp-signing.pem -in "$f" \
              | base64 -w0 > "$sigpath"
            echo "  signed: $f → $sigpath"
          }
          # Each manifest gets its OWN signature file. (Both previously wrote
          # to docs/knowledge.yaml.sig, so the root manifest's signature was
          # always overwritten by the docs one — and the two files differ.)
          # Root manifest — adjacent .sig for git-clone consumers (SPEC §16)
          sign_manifest knowledge.yaml knowledge.yaml.sig
          # docs/ manifest — served by GitHub Pages; this is the sig that
          # entity.signature and llms.txt point at
          sign_manifest docs/knowledge.yaml docs/knowledge.yaml.sig

      - name: Commit and push
        run: |
          git config user.name  "kcp-bot[bot]"
          git config user.email "actions@cantara.no"
          git add knowledge.yaml.sig docs/knowledge.yaml.sig
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "chore: refresh manifest signatures [skip-sign]"
            git push
          fi
