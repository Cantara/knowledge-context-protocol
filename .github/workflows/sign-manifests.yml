name: Sign KCP manifests

on:
  push:
    branches: [main]
    paths:
      - 'knowledge.yaml'
      - 'docs/knowledge.yaml'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-sign]')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Build kcp CLI
        run: |
          cd cli
          npm ci
          npm run build

      - name: Restore signing key
        env:
          KCP_SIGNING_KEY: ${{ secrets.KCP_SIGNING_KEY }}
        run: |
          printf '%s' "$KCP_SIGNING_KEY" > /tmp/kcp-signing.pem
          chmod 600 /tmp/kcp-signing.pem

      - name: Sign manifests (RFC-0018 §4.2 detached envelope)
        run: |
          set -euo pipefail
          sign_manifest() {
            local f="$1"
            node cli/dist/cli.js sign "$f" \
              --key /tmp/kcp-signing.pem \
              --key-id cantara-org-2026 \
              --out "${f}.sig"
            echo "  signed: $f → ${f}.sig"
          }
          # Root manifest — adjacent .sig for git-clone consumers (SPEC §16)
          sign_manifest knowledge.yaml
          # docs/ manifest — served by GitHub Pages
          sign_manifest docs/knowledge.yaml

      - name: Commit and push
        run: |
          git config user.name  "kcp-bot[bot]"
          git config user.email "actions@cantara.no"
          git add knowledge.yaml.sig docs/knowledge.yaml.sig
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "chore: refresh manifest signatures [skip-sign]"
            git push
          fi
