name: Sign KCP manifests

on:
  push:
    branches: [main]
    paths:
      - 'knowledge.yaml'
      - 'docs/knowledge.yaml'
      # The root manifest binds per-unit content_hash (RFC-0019) over these
      # documents; a change to any of them must re-hash and re-sign.
      - 'SPEC.md'
      - 'RFC-*.md'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-sign]')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Build kcp CLI
        run: |
          cd cli
          npm ci
          npm run build

      - name: Restore signing key
        env:
          KCP_SIGNING_KEY: ${{ secrets.KCP_SIGNING_KEY }}
        run: |
          # Org convention since the 2026-05-07 rotation: KCP_SIGNING_KEY is
          # the base64-encoded Ed25519 private key PEM (see Cantara/.github
          # sign-kcp.yml). Decode before use.
          printf '%s' "$KCP_SIGNING_KEY" | base64 -d > /tmp/kcp-signing.pem
          chmod 600 /tmp/kcp-signing.pem

      - name: Sign manifests (RFC-0018 §4.2 detached envelope)
        run: |
          set -euo pipefail
          sign_manifest() {
            local f="$1"
            # --update-hashes recomputes every declared content_hash (RFC-0019
            # §3.1) against the current file bytes before signing, so the
            # signature always covers the content, not just the manifest. It is
            # a no-op for manifests with no content_hash declarations.
            node cli/dist/cli.js sign "$f" \
              --key /tmp/kcp-signing.pem \
              --key-id cantara-org-2026 \
              --update-hashes \
              --out "${f}.sig"
            echo "  signed: $f → ${f}.sig"
          }
          # Root manifest — adjacent .sig for git-clone consumers (SPEC §16)
          sign_manifest knowledge.yaml
          # docs/ manifest — served by GitHub Pages
          sign_manifest docs/knowledge.yaml

      - name: Commit and push
        run: |
          git config user.name  "kcp-bot[bot]"
          git config user.email "actions@cantara.no"
          # --update-hashes may have refreshed content_hash values in the
          # manifests, so commit them alongside the signatures.
          git add knowledge.yaml docs/knowledge.yaml knowledge.yaml.sig docs/knowledge.yaml.sig
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "chore: refresh manifest signatures [skip-sign]"
            git push
          fi
