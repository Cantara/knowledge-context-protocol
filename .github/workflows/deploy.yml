name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The published manifest is the root manifest — a change to it must redeploy.
      - 'knowledge.yaml'
      - 'knowledge.yaml.sig'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The published copy IS the root manifest, copied at deploy time. It used to be a
      # hand-maintained duplicate in docs/, which drifted to nine minor versions stale
      # (kcp_version 0.21 served while the repo was at 0.30) without anything noticing —
      # #180. A copy nobody regenerates will drift again, so the duplicate is gone and
      # the class with it.
      - name: Publish the root manifest, not a copy
        run: |
          cp knowledge.yaml docs/knowledge.yaml
          cp knowledge.yaml.sig docs/knowledge.yaml.sig

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
